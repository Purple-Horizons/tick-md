name: Publish to npm

on:
  push:
    tags:
      - 'v*'  # Release tag = CLI version, e.g. v1.3.0

# Publish order: core -> CLI -> MCP. Each step skips if that exact
# name@version is already on npm, so only bumped packages are published.

jobs:
  publish-core:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          registry-url: 'https://registry.npmjs.org'

      - name: Check tag matches CLI version
        run: |
          CLI_VERSION=$(node -p "require('./cli/package.json').version")
          if [ "${GITHUB_REF_NAME}" != "v${CLI_VERSION}" ]; then
            echo "Tag ${GITHUB_REF_NAME} does not match cli/package.json version v${CLI_VERSION}"
            exit 1
          fi

      - name: Install dependencies
        run: npm ci
        working-directory: cli

      - name: Build core
        run: npm run build -w @gianni-dalerta/tick-core
        working-directory: cli

      - name: Publish core (if new version)
        working-directory: packages/tick-core
        run: |
          NAME=$(node -p "require('./package.json').name")
          VERSION=$(node -p "require('./package.json').version")
          if npm view "${NAME}@${VERSION}" version >/dev/null 2>&1; then
            echo "${NAME}@${VERSION} already published; skipping"
          else
            npm publish --access public
          fi
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}

  publish-cli:
    runs-on: ubuntu-latest
    needs: publish-core
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          registry-url: 'https://registry.npmjs.org'

      - name: Install dependencies
        run: npm ci
        working-directory: cli

      - name: Build
        run: npm run build
        working-directory: cli

      - name: Test
        run: npm test
        working-directory: cli

      - name: Publish CLI (if new version)
        working-directory: cli
        run: |
          NAME=$(node -p "require('./package.json').name")
          VERSION=$(node -p "require('./package.json').version")
          if npm view "${NAME}@${VERSION}" version >/dev/null 2>&1; then
            echo "${NAME}@${VERSION} already published; skipping"
          else
            npm publish --access public
          fi
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}

  publish-mcp:
    runs-on: ubuntu-latest
    needs: publish-cli
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          registry-url: 'https://registry.npmjs.org'

      - name: Install MCP dependencies
        run: npm ci
        working-directory: mcp

      - name: Build MCP
        run: npm run build
        working-directory: mcp

      - name: Publish MCP Server (if new version)
        working-directory: mcp
        run: |
          NAME=$(node -p "require('./package.json').name")
          VERSION=$(node -p "require('./package.json').version")
          if npm view "${NAME}@${VERSION}" version >/dev/null 2>&1; then
            echo "${NAME}@${VERSION} already published; skipping"
          else
            npm publish --access public
          fi
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}
