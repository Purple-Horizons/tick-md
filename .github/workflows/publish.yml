name: Publish to npm

# Publishes via npm trusted publishing (OIDC). No npm token is used.
# Each package has a GitHub Actions trusted publisher on npmjs.com:
#   org Purple-Horizons, repo tick-md, workflow publish.yml, no environment.

on:
  push:
    tags:
      - 'v*'  # Release tag = CLI version, e.g. v1.3.0
  workflow_dispatch: # Manual (re)run from a branch, e.g. main

permissions:
  id-token: write  # required for npm trusted publishing + provenance
  contents: read

# Publish order: core -> CLI -> MCP. Each step skips if that exact
# name@version is already on npm, so only bumped packages are published.

jobs:
  publish-core:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          registry-url: 'https://registry.npmjs.org'

      - name: Upgrade npm (trusted publishing needs npm >= 11.5.1)
        run: npm install -g npm@latest && npm --version

      - name: Check tag matches CLI version
        if: github.ref_type == 'tag'
        run: |
          CLI_VERSION=$(node -p "require('./cli/package.json').version")
          if [ "${GITHUB_REF_NAME}" != "v${CLI_VERSION}" ]; then
            echo "Tag ${GITHUB_REF_NAME} does not match cli/package.json version v${CLI_VERSION}"
            exit 1
          fi

      - name: Install dependencies
        run: npm ci
        working-directory: cli

      - name: Build core
        run: npm run build -w @gianni-dalerta/tick-core
        working-directory: cli

      - name: Publish core (if new version)
        working-directory: packages/tick-core
        run: |
          NAME=$(node -p "require('./package.json').name")
          VERSION=$(node -p "require('./package.json').version")
          if npm view "${NAME}@${VERSION}" version >/dev/null 2>&1; then
            echo "${NAME}@${VERSION} already published; skipping"
          else
            npm publish --provenance --access public
          fi

  publish-cli:
    runs-on: ubuntu-latest
    needs: publish-core
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          registry-url: 'https://registry.npmjs.org'

      - name: Upgrade npm (trusted publishing needs npm >= 11.5.1)
        run: npm install -g npm@latest && npm --version

      - name: Install dependencies
        run: npm ci
        working-directory: cli

      - name: Build
        run: npm run build
        working-directory: cli

      - name: Test
        run: npm test
        working-directory: cli

      - name: Publish CLI (if new version)
        working-directory: cli
        run: |
          NAME=$(node -p "require('./package.json').name")
          VERSION=$(node -p "require('./package.json').version")
          if npm view "${NAME}@${VERSION}" version >/dev/null 2>&1; then
            echo "${NAME}@${VERSION} already published; skipping"
          else
            npm publish --provenance --access public
          fi

  publish-mcp:
    runs-on: ubuntu-latest
    needs: publish-cli
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          registry-url: 'https://registry.npmjs.org'

      - name: Upgrade npm (trusted publishing needs npm >= 11.5.1)
        run: npm install -g npm@latest && npm --version

      - name: Install MCP dependencies
        run: npm ci
        working-directory: mcp

      - name: Build MCP
        run: npm run build
        working-directory: mcp

      - name: Publish MCP Server (if new version)
        working-directory: mcp
        run: |
          NAME=$(node -p "require('./package.json').name")
          VERSION=$(node -p "require('./package.json').version")
          if npm view "${NAME}@${VERSION}" version >/dev/null 2>&1; then
            echo "${NAME}@${VERSION} already published; skipping"
          else
            npm publish --provenance --access public
          fi
